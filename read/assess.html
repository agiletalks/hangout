<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國泰人壽《溝通引導術》評估工具手冊</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #009E52; /* 國泰綠 */
            --primary-dark: #007A3E;
            --primary-light: rgba(0, 158, 82, 0.08);
            --primary-glow: rgba(0, 158, 82, 0.15);
            --accent: #FFD100; /* 大樹金 */
            --accent-dark: #E6BC00;
            --bg-app: #F3F7F4;
            --bg-card: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 158, 82, 0.06);
            --shadow-lg: 0 16px 40px rgba(0, 158, 82, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        button, input, textarea {
            font-family: inherit;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 158, 82, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #FFFFFF;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            z-index: 100;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-menu-toggle {
            background: transparent;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .btn-menu-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .logo-tree {
            width: 22px;
            height: 22px;
            fill: var(--primary);
        }

        .header-title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-title-group p {
            font-size: 0.8rem;
            opacity: 0.85;
            margin-top: 2px;
        }

        .badge-brand {
            background: var(--accent);
            color: #1F2937;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-accent {
            background-color: var(--accent);
            color: #1F2937;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 209, 0, 0.3);
        }
        .btn-accent:hover {
            background-color: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn-outline-white {
            background-color: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-outline-white:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #FFFFFF;
        }

        /* Main Container */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: var(--transition);
            z-index: 90;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: #FCFDFD;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .progress-box {
            background-color: var(--bg-app);
            padding: 12px;
            border-radius: var(--radius-sm);
        }
        .progress-title-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .progress-bar-bg {
            height: 6px;
            background: #E5E7EB;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary) 0%, #00C06A 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .tools-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-bottom: 6px;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .tool-item:hover {
            background-color: var(--primary-light);
        }
        .tool-item.active {
            background-color: var(--primary-light);
            border-color: var(--primary-glow);
            font-weight: 700;
        }
        .tool-item-id {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background-color: #E5E7EB;
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 50%;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .tool-item.active .tool-item-id {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .tool-item.completed .tool-item-id {
            background-color: var(--primary-dark);
            color: #FFFFFF;
        }
        .tool-item-title {
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background-color: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 避免拉伸卡片高度，使其能隨內容自動擴展 */
        }

        .content-card {
            width: 100%;
            max-width: 860px;
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .tool-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .tool-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tool-badge {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFFFFF;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 158, 82, 0.2);
        }
        .tool-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .tool-description {
            font-size: 1.05rem;
            line-height: 1.7;
            padding: 16px 20px;
            background-color: #FAFBFB;
            border-left: 5px solid var(--primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: #374151;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        .text-paragraph {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4B5563;
            margin-bottom: 12px;
        }

        /* Tables styling */
        .content-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .content-table th {
            background-color: var(--primary-dark);
            color: #FFFFFF;
            text-align: left;
            padding: 12px 16px;
            font-weight: 700;
        }
        .content-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: #FFFFFF;
            color: var(--text-main);
            line-height: 1.5;
        }
        .content-table tr:nth-of-type(even) td {
            background-color: #F9FAFB;
        }

        /* Practice area */
        .practice-box {
            background-color: #FCFAF2;
            border: 1.5px solid rgba(255, 209, 0, 0.25);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: 0 4px 15px rgba(255, 209, 0, 0.03);
        }

        .note-wrapper {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .save-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .save-indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary);
        }
        .save-indicator-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #E5E7EB;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .note-textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            transition: var(--transition);
            background-color: #FFFFFF;
        }
        .note-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        /* Sidebar Overlay (Mobile) */
        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 85;
            display: none;
            backdrop-filter: blur(2px);
        }

        /* Print container */
        #print-container {
            display: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .btn-menu-toggle {
                display: flex;
            }
            .sidebar {
                position: absolute;
                left: -320px;
                top: 0;
                bottom: 0;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            }
            .app-container.menu-open .sidebar {
                left: 0;
            }
            .app-container.menu-open .sidebar-overlay {
                display: block;
            }
            main {
                padding: 16px;
            }
            .content-card {
                padding: 24px;
                gap: 20px;
            }
            .tool-title {
                font-size: 1.4rem;
            }
            .header-title-group h1 {
                font-size: 1.1rem;
            }
            .header-title-group p {
                font-size: 0.7rem;
            }
            .btn span {
                display: none;
            }
            .btn {
                padding: 8px 10px;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: #FFFFFF !important;
                color: #000000 !important;
                height: auto !important;
                overflow: visible !important;
            }
            header, .app-container, .sidebar, main, .sidebar-overlay {
                display: none !important;
            }
            #print-container {
                display: block !important;
                padding: 20px !important;
            }
            .print-page {
                page-break-after: always;
                padding: 20px 0;
                border-bottom: 2px solid #E5E7EB;
                margin-bottom: 30px;
            }
            .print-title {
                font-size: 1.6rem;
                font-weight: 700;
                margin-bottom: 12px;
                color: #007A3E !important;
            }
            .print-desc {
                font-size: 1.05rem;
                padding: 12px;
                background-color: #F9FAFB !important;
                border-left: 4px solid #009E52 !important;
                margin-bottom: 20px;
                font-style: italic;
            }
            .print-h3 {
                font-size: 1.15rem;
                font-weight: 700;
                margin: 16px 0 8px 0;
                color: #374151 !important;
            }
            .print-note-box {
                margin-top: 24px;
                padding: 16px;
                background-color: #FAFAFA !important;
                border: 1px solid #CCCCCC !important;
                border-radius: 6px;
            }
            .print-note-title {
                font-size: 0.95rem;
                font-weight: 700;
                margin-bottom: 8px;
            }
            .print-note-content {
                font-size: 0.95rem;
                line-height: 1.6;
                white-space: pre-wrap;
            }
            .print-note-content.empty {
                color: #777777 !important;
                font-style: italic;
            }
        }
    </style>
</head>
<body>
    <!-- 密碼保護驗證區 -->
    <div id="password-lock-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #F3F7F4; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; opacity: 1; transition: opacity 0.3s ease;">
        <div style="background-color: #FFFFFF; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,158,82,0.08); text-align: center; max-width: 400px; width: 90%; border: 1px solid #E5E7EB; box-sizing: border-box;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background-color: #009E52; border-radius: 50%; margin-bottom: 20px; color: #FFFFFF;">
                <svg width="28" height="28" fill="currentColor" viewBox="0 0 16 16" style="width: 28px; height: 28px;">
                    <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                </svg>
            </div>
            <h2 style="font-size: 1.4rem; color: #1F2937; margin-bottom: 10px; font-weight: 700; margin-top: 0;">國泰人壽 敏捷種子培訓</h2>
            <p style="font-size: 0.9rem; color: #6B7280; margin-bottom: 24px; margin-top: 0; line-height: 1.5;">本教材受密碼保護，請輸入國泰人壽統一編號以開啟內容</p>
            <div style="position: relative; margin-bottom: 16px;">
                <input type="password" id="lock-password-input" placeholder="請輸入 8 碼統一編號" style="width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 8px; font-size: 1rem; outline: none; box-sizing: border-box; text-align: center; letter-spacing: 2px;">
            </div>
            <button id="lock-submit-btn" style="width: 100%; padding: 12px; background-color: #009E52; color: #FFFFFF; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 158, 82, 0.2); box-sizing: border-box;">確定送出</button>
            <p id="lock-error-msg" style="color: #EF4444; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: 500; margin-bottom: 0;">❌ 密碼錯誤，請重新輸入！</p>
        </div>
    </div>
    <script>
        (function() {
            const correctHash = "03374707";
            if (sessionStorage.getItem('read_courseware_authorized') === 'true') {
                document.write('<style>#password-lock-screen { display: none !important; }</style>');
                return;
            }
            window.addEventListener('DOMContentLoaded', () => {
                const lockScreen = document.getElementById('password-lock-screen');
                const passwordInput = document.getElementById('lock-password-input');
                const submitBtn = document.getElementById('lock-submit-btn');
                const errorMsg = document.getElementById('lock-error-msg');
                
                function verify() {
                    if (passwordInput.value.trim() === correctHash) {
                        sessionStorage.setItem('read_courseware_authorized', 'true');
                        lockScreen.style.opacity = '0';
                        setTimeout(() => { lockScreen.style.display = 'none'; }, 300);
                    } else {
                        errorMsg.style.display = 'block';
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }
                submitBtn.addEventListener('click', verify);
                passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verify(); });
                passwordInput.focus();
            });
        })();
    </script>


    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="btn-menu-toggle" id="menu-toggle" title="切換選單">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
                </svg>
            </button>
            <div class="logo-container">
                <svg class="logo-tree" viewBox="0 0 24 24">
                    <path d="M12 2C8.68 2 6 4.68 6 8c0 2.22 1.21 4.15 3 5.19V18c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-4.81c1.79-1.04 3-2.97 3-5.19 0-3.32-2.68-6-6-6zm2 15h-4v-1h4v1zm0-2h-4v-1h4v1zm-2-4c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" />
                </svg>
            </div>
            <div class="header-title-group">
                <h1>溝通引導術 <span class="badge-brand">評估工具手冊</span></h1>
                <p>國泰人壽 敏捷種子培訓課程 (Percy 老師)</p>
            </div>
        </div>
        
        <div class="header-right">
            <button class="btn btn-accent" id="export-pdf-btn" title="列印或另存 PDF">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                    <path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5A.5.5 0 0 1 5 8zm0 2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/>
                </svg>
                <span>列印/匯出個人手冊</span>
            </button>
        </div>
    </header>

    <!-- App Container -->
    <div class="app-container" id="app-wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <!-- Search -->

                "scenario": [

                "scenario": [

                        {

        // App state
        const state = {
            currentIndex: 0,
            notes: {},
            searchQuery: '',
            menuOpen: false
        };

        const elements = {
            appWrapper: document.getElementById('app-wrapper'),
            menuToggle: document.getElementById('menu-toggle'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            searchBox: document.getElementById('search-box'),
            progressPercent: document.getElementById('progress-percent'),
            progressFill: document.getElementById('progress-fill'),
            toolsList: document.getElementById('tools-list'),
            detailCard: document.getElementById('detail-card'),
            exportPdfBtn: document.getElementById('export-pdf-btn'),
            printContainer: document.getElementById('print-container')
        };

        // Initialize App
        function init() {
            loadNotes();
            renderSidebar();
            updateProgress();
            showTool(state.currentIndex);
            setupEventListeners();
        }

        // Load Notes from LocalStorage
        function loadNotes() {
            const saved = localStorage.getItem('cathay_assess_notes');
            if (saved) {
                try {
                    state.notes = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse localStorage notes:', e);
                    state.notes = {};
                }
            }
        }

        // Save Notes
        function saveNote(toolId, text) {
            state.notes[toolId] = text;
            localStorage.setItem('cathay_assess_notes', JSON.stringify(state.notes));
            updateProgress();
            
            // Highlight item if completed
            const itemEl = document.querySelector(`.tool-item[data-id="${toolId}"]`);
            if (itemEl) {
                if (text.trim()) {
                    itemEl.classList.add('completed');
                } else {
                    itemEl.classList.remove('completed');
                }
            }
        }

        // Update progress bar
        function updateProgress() {
            let completedCount = 0;
            toolsData.forEach(t => {
                const note = state.notes[t.id];
                if (note && note.trim()) {
                    completedCount++;
                }
            });

            const percent = Math.round((completedCount / toolsData.length) * 100);
            elements.progressPercent.textContent = `${percent}% (${completedCount}/${toolsData.length} 招)`;
            elements.progressFill.style.width = `${percent}%`;
        }

        // Render Sidebar List
        function renderSidebar() {
            elements.toolsList.innerHTML = '';
            
            const filtered = toolsData.filter(t => {
                const q = state.searchQuery.toLowerCase();
                const note = state.notes[t.id] || '';
                return t.title.toLowerCase().includes(q) || 
                       t.description.toLowerCase().includes(q) ||
                       note.toLowerCase().includes(q);
            });

            filtered.forEach(t => {
                const item = document.createElement('div');
                item.className = 'tool-item';
                item.setAttribute('data-id', t.id);
                if (t.id - 1 === state.currentIndex) {
                    item.classList.add('active');
                }
                
                const note = state.notes[t.id];
                if (note && note.trim()) {
                    item.classList.add('completed');
                }

                const idStr = t.id < 10 ? '0' + t.id : t.id;
                item.innerHTML = `
                    <span class="tool-item-id">${idStr}</span>
                    <span class="tool-item-title">${t.title}</span>
                `;

                item.addEventListener('click', () => {
                    const originalIndex = toolsData.findIndex(item => item.id === t.id);
                    state.currentIndex = originalIndex;
                    
                    document.querySelectorAll('.tool-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    
                    showTool(state.currentIndex);
                    closeMenu();
                });

                elements.toolsList.appendChild(item);
            });
        }

        // Show Tool details
        function showTool(index) {
            const tool = toolsData[index];
            if (!tool) return;

            const idStr = tool.id < 10 ? '0' + tool.id : tool.id;
            const currentNote = state.notes[tool.id] || '';

            // Generate learning scenario HTML
            let scenarioHtml = '';
            tool.scenario.forEach(node => {
                if (node.type === 'text') {
                    scenarioHtml += `<p class="text-paragraph">${node.content}</p>`;
                } else if (node.type === 'table') {
                    scenarioHtml += generateTableHtml(node.content);
                }
            });

            // Generate exercise HTML
            let exerciseHtml = '';
            tool.exercise.forEach(node => {
                if (node.type === 'text') {
                    exerciseHtml += `<p class="text-paragraph">${node.content}</p>`;
                } else if (node.type === 'table') {
                    exerciseHtml += generateTableHtml(node.content);
                }
            });

            const exerciseSection = exerciseHtml ? `
                <div class="practice-box">
                    <div class="section-title">延伸練習</div>
                    ${exerciseHtml}
                </div>
            ` : '';

            elements.detailCard.innerHTML = `
                <div class="tool-header">
                    <div class="tool-meta">
                        <span class="tool-badge">引導工具 ${idStr}</span>
                        <h2 class="tool-title">${tool.title}</h2>
                    </div>
                </div>

                <div class="tool-description">
                    ${tool.description}
                </div>

                <div class="scenario-section">
                    <div class="section-title">學習情境與案例</div>
                    ${scenarioHtml}
                </div>

                ${exerciseSection}

                <div class="note-wrapper">
                    <div class="note-header">
                        <label for="assess-note-textarea" class="note-label">個人學習與實踐筆記</label>
                        <span class="save-indicator" id="save-status">
                            <span class="save-indicator-spinner" id="save-spinner"></span>
                            <span class="save-indicator-dot" id="save-dot"></span>
                            <span id="save-status-text">已自動存檔</span>
                        </span>
                    </div>
                    <textarea class="note-textarea" id="assess-note-textarea" placeholder="在此記錄您的想法、回答延伸練習問題，或寫下工作中的實踐計畫...系統將自動同步存檔。">${currentNote}</textarea>
                </div>
            `;

            // Bind textarea events
            const textarea = document.getElementById('assess-note-textarea');
            const saveText = document.getElementById('save-status-text');
            const saveDot = document.getElementById('save-dot');
            const saveSpinner = document.getElementById('save-spinner');

            let timeoutId;
            textarea.addEventListener('input', (e) => {
                // Show saving spinner
                saveText.textContent = '存檔中...';
                saveDot.style.display = 'none';
                saveSpinner.style.display = 'block';

                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    saveNote(tool.id, e.target.value);
                    
                    // Show saved status
                    saveText.textContent = '已自動存檔';
                    saveDot.style.display = 'block';
                    saveSpinner.style.display = 'none';
                }, 500);
            });
        }

        // Helper to generate HTML tables
        function generateTableHtml(matrix) {
            let html = '<table class="content-table">';
            matrix.forEach((row, rIdx) => {
                html += '<tr>';
                row.forEach(cell => {
                    if (rIdx === 0) {
                        html += `<th>${cell}</th>`;
                    } else {
                        html += `<td>${cell}</td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</table>';
            return html;
        }

        // Setup Events
        function setupEventListeners() {
            // Search box
            elements.searchBox.addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                renderSidebar();
            });

            // Mobile menu toggle
            elements.menuToggle.addEventListener('click', toggleMenu);
            elements.sidebarOverlay.addEventListener('click', closeMenu);

            // Export PDF
            elements.exportPdfBtn.addEventListener('click', generatePrintView);
        }

        function toggleMenu() {
            state.menuOpen = !state.menuOpen;
            if (state.menuOpen) {
                elements.appWrapper.classList.add('menu-open');
            } else {
                elements.appWrapper.classList.remove('menu-open');
            }
        }

        function closeMenu() {
            state.menuOpen = false;
            elements.appWrapper.classList.remove('menu-open');
        }

        // Generate Print/PDF View
        function generatePrintView() {
            elements.printContainer.innerHTML = '';
            
            // Header for print
            const docHeader = document.createElement('div');
            docHeader.style.textAlign = 'center';
            docHeader.style.marginBottom = '40px';
            docHeader.innerHTML = `
                <h1 style="font-size: 2.2rem; color: #007A3E; margin-bottom: 8px;">國泰人壽《溝通引導術》個人評估工具筆記手冊</h1>
                <p style="font-size: 1rem; color: #4B5563;">學員專屬課後實踐指南 • 講師: Percy 老師</p>
                <div style="margin-top: 15px; font-size: 0.9rem; color: #6B7280;">匯出時間: ${new Date().toLocaleDateString('zh-TW')}</div>
            `;
            elements.printContainer.appendChild(docHeader);

            // Loop and add tools
            toolsData.forEach(t => {
                const page = document.createElement('div');
                page.className = 'print-page';

                const idStr = t.id < 10 ? '0' + t.id : t.id;
                const note = state.notes[t.id] || '';
                const noteHtml = note.trim() 
                    ? `<div class="print-note-content">${note.replace(/\n/g, '<br>')}</div>` 
                    : `<div class="print-note-content empty">（尚未填寫此招之實踐筆記，可用於課後筆記書寫）</div>`;

                // Build scenario HTML
                let scenarioHtml = '';
                t.scenario.forEach(node => {
                    if (node.type === 'text') {
                        scenarioHtml += `<p style="font-size: 0.95rem; line-height: 1.5; margin-bottom: 8px;">${node.content}</p>`;
                    } else if (node.type === 'table') {
                        scenarioHtml += generateTableHtml(node.content);
                    }
                });

                // Build exercise HTML
                let exerciseHtml = '';
                t.exercise.forEach(node => {
                    if (node.type === 'text') {
                        exerciseHtml += `<p style="font-size: 0.95rem; line-height: 1.5; margin-bottom: 8px;">${node.content}</p>`;
                    } else if (node.type === 'table') {
                        exerciseHtml += generateTableHtml(node.content);
                    }
                });

                const exerciseBlock = exerciseHtml ? `
                    <h4 class="print-h3">延伸練習</h4>
                    ${exerciseHtml}
                ` : '';

                page.innerHTML = `
                    <h2 class="print-title">引導工具 ${idStr}：${t.title}</h2>
                    <div class="print-desc">${t.description}</div>
                    
                    <h3 class="print-h3">學習情境與案例</h3>
                    ${scenarioHtml}
                    
                    ${exerciseBlock}

                    <div class="print-note-box">
                        <div class="print-note-title">✍️ 我的個人實踐與課後筆記：</div>
                        ${noteHtml}
                    </div>
                `;

                elements.printContainer.appendChild(page);
            });

            // Trigger Print
            window.print();
        }

        // Run Init on Load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
