<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國泰人壽《溝通引導術》互動講義</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS Styles -->
    <style>
        :root {
            /* 國泰人壽 brand colors */
            --primary: #009E52; /* 國泰綠 */
            --primary-dark: #007A3E;
            --primary-light: rgba(0, 158, 82, 0.08);
            --primary-glow: rgba(0, 158, 82, 0.15);
            --accent: #FFD100; /* 大樹金 */
            --accent-dark: #E6BC00;
            --bg-app: #F3F7F4;
            --bg-card: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 158, 82, 0.06);
            --shadow-lg: 0 16px 40px rgba(0, 158, 82, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 全域重設與基底樣式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        button, input, textarea {
            font-family: inherit;
        }

        /* 捲軸美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 158, 82, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ==================== 網頁頁首 (Header) ==================== */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: #FFFFFF;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            z-index: 100;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 漢堡選單按鈕 */
        .btn-sidebar-toggle {
            background: transparent;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .btn-sidebar-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* 國泰大樹概念設計標誌 */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .logo-tree {
            width: 22px;
            height: 22px;
            fill: var(--primary);
        }

        .header-title-group h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title-group p {
            font-size: 0.8rem;
            opacity: 0.85;
            margin-top: 2px;
        }

        .badge-brand {
            background: var(--accent);
            color: #1F2937;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 按鈕基礎 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-accent {
            background-color: var(--accent);
            color: #1F2937;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 209, 0, 0.3);
        }
        .btn-accent:hover {
            background-color: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn-outline-white {
            background-color: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-outline-white:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #FFFFFF;
        }

        /* 模式切換按鈕組 */
        .mode-toggle-group {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: var(--radius-sm);
            display: flex;
            gap: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-mode-tab {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-mode-tab.active {
            background-color: #FFFFFF;
            color: var(--primary-dark);
            font-weight: 700;
            box-shadow: var(--shadow-sm);
        }

        /* ==================== 應用主容器 layout ==================== */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 64px);
            position: relative;
            overflow: hidden;
        }

        /* ==================== 側邊欄大綱 (Sidebar) ==================== */
        .sidebar {
            width: 260px;
            background-color: #FFFFFF;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 90;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* 電腦版收合狀態 */
        .sidebar-collapsed .sidebar {
            width: 0;
            border-right-width: 0;
            opacity: 0;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            transition: var(--transition);
            background-color: #F9FAFB;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        /* 學習進度條 */
        .progress-box {
            background-color: var(--primary-light);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            border: 1px solid rgba(0, 158, 82, 0.1);
        }
        .progress-title-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            height: 6px;
            background-color: rgba(0, 158, 82, 0.15);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        /* 投影片導航清單 (風琴摺樣式) */
        .slides-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .category-group {
            border-bottom: 1px solid var(--border-color);
        }
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #F9FAFB;
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary-dark);
            border-left: 3px solid transparent;
        }
        .category-header:hover {
            background-color: #F3F4F6;
        }
        .category-header.active {
            background-color: var(--primary-light);
            border-left-color: var(--primary);
        }
        .category-arrow {
            width: 14px;
            height: 14px;
            transition: transform 0.3s ease;
            fill: var(--text-muted);
        }
        .category-group.collapsed .category-arrow {
            transform: rotate(-90deg);
        }
        .category-items {
            max-height: 800px;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-group.collapsed .category-items {
            max-height: 0 !important;
        }

        .slide-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 20px 10px 30px; /* 左側縮排表示層級 */
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            user-select: none;
            background-color: #FFFFFF;
        }
        .slide-item:hover {
            background-color: #F3F4F6;
        }
        .slide-item.active {
            background-color: var(--primary-light);
            border-left-color: var(--primary);
        }

        .slide-info {
            flex: 1;
            min-width: 0;
        }
        .slide-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .slide-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .note-status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
            display: none;
        }
        .slide-item.has-note .note-status-dot {
            display: inline-block;
        }

        /* ==================== 網頁主內容區 (Main Content) ==================== */
        main {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-app);
            padding: 24px;
            transition: var(--transition);
        }

        /* ==================== 單頁專注模式 (Focus Mode Layout) ==================== */
        .focus-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
            gap: 24px;
            height: 100%;
            align-content: stretch;
        }

        /* 左欄：投影片顯示卡片 */
        .slide-display-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .slide-img-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: var(--radius-md);
            background-color: #111827;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .slide-main-image {
            max-width: 100%;
            max-height: 76vh;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* 圖片放大按鈕 */
        .zoom-overlay-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: rgba(17, 24, 39, 0.7);
            color: #FFFFFF;
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zoom-overlay-btn:hover {
            background-color: var(--primary);
            transform: scale(1.05);
        }

        /* 右欄：筆記與操作面板 */
        .control-panel-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: space-between;
        }

        .panel-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }
        .panel-slide-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .panel-slide-index {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-dark);
            background-color: var(--primary-light);
            padding: 2px 10px;
            border-radius: 20px;
        }
        .panel-slide-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* 筆記區 */
        .note-area-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .note-label::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: var(--primary);
            border-radius: 2px;
        }

        /* 自動存檔狀態標籤 */
        .save-indicator {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            opacity: 0;
        }
        .save-indicator.visible {
            opacity: 1;
        }
        .save-indicator-spinner {
            width: 10px;
            height: 10px;
            border: 2px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .save-indicator.saving .save-indicator-spinner {
            display: inline-block;
        }
        .save-indicator.saving .save-indicator-dot {
            display: none;
        }
        .save-indicator-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .note-textarea {
            width: 100%;
            flex: 1;
            min-height: 180px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            transition: var(--transition);
            background-color: #F9FAFB;
        }
        .note-textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .note-textarea::placeholder {
            color: #9CA3AF;
            font-size: 0.9rem;
        }

        /* 導航按鈕區 */
        .navigation-row {
            display: flex;
            gap: 12px;
        }
        .navigation-row .btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
        }
        .btn-prev {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-prev:hover:not(:disabled) {
            background-color: #F3F4F6;
            border-color: #D1D5DB;
        }
        .btn-next {
            background-color: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(0, 158, 82, 0.2);
        }
        .btn-next:hover:not(:disabled) {
            background-color: var(--primary-dark);
            box-shadow: 0 4px 20px rgba(0, 158, 82, 0.3);
        }
        .navigation-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ==================== 全覽模式 (List Mode Layout) ==================== */
        .list-layout {
            display: flex;
            flex-direction: column;
            gap: 32px;
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .list-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            transition: var(--transition);
        }
        .list-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .list-card-image-box {
            background-color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-right: 1px solid var(--border-color);
            position: relative;
        }
        .list-card-img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }

        .list-card-content-box {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ==================== 圖片燈箱 (Lightbox) ==================== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(17, 24, 39, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox-img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lightbox.active .lightbox-img {
            transform: scale(1);
        }
        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: var(--transition);
        }
        .lightbox-close:hover {
            background-color: #EF4444;
            transform: rotate(90deg);
        }

        /* ==================== 列印專用隱藏容器 ==================== */
        #print-container {
            display: none;
        }

        /* ==================== 動畫與關鍵影格 ==================== */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== 響應式佈局調整 (Media Queries) ==================== */
        @media (max-width: 1024px) {
            .focus-layout {
                grid-template-columns: 1.2fr 1fr;
                gap: 16px;
            }
            .sidebar {
                width: 240px;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }
            .app-container {
                height: auto;
                overflow: visible;
            }
            main {
                overflow-y: visible;
                padding: 16px;
                height: auto;
            }
            
            /* 行動版滑出式抽屜側欄 */
            .sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                width: 280px;
                height: 100vh;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
                z-index: 120;
            }
            .sidebar.active {
                left: 0;
            }
            
            /* 行動版收合無動畫重設 */
            .sidebar-collapsed .sidebar {
                width: 280px;
                opacity: 1;
            }
            
            /* 漢堡選單遮罩 */
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(17, 24, 39, 0.5);
                z-index: 115;
                display: none;
            }
            .sidebar-overlay.active {
                display: block;
            }

            /* 單頁專注模式改為上下疊放 */
            .focus-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                gap: 16px;
            }
            .slide-display-card {
                min-height: 250px;
                padding: 12px;
            }
            .slide-main-image {
                max-height: 45vh;
            }
            .control-panel-card {
                padding: 16px;
            }
            .note-textarea {
                min-height: 150px;
            }

            /* 全覽清單卡片改為上下疊放 */
            .list-card {
                grid-template-columns: 1fr;
            }
            .list-card-image-box {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            header {
                padding: 12px 16px;
            }
            .header-title-group h1 {
                font-size: 1.1rem;
            }
            .header-right {
                gap: 8px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }

        /* AI Prompt Card styles */
        .ai-prompt-card {
            background-color: #F8FAFC;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;

          <div style="position: relative; margin-bottom: 16px;">
              <input type="password" id="lock-password-input" placeholder="請輸入 8 碼統一編號" style="width: 100%; padding: 12px 16px; border: 1.5px solid #E5E7EB; border-radius: 8px; font-size: 1rem; outline: none; box-sizing: border-box; text-align: center; letter-spacing: 2px;">
          </div>
          <button id="lock-submit-btn" style="width: 100%; padding: 12px; background-color: #009E52; color: #FFFFFF; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 158, 82, 0.2); box-sizing: border-box;">確定送出</button>
          <p id="lock-error-msg" style="color: #EF4444; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: 500; margin-bottom: 0;">❌ 密碼錯誤，請重新輸入！</p>
      </div>
  </div>
  <script>
      (function() {
          const correctHash = "03374707";
          if (sessionStorage.getItem('read_courseware_authorized') === 'true') {
              document.write('<style>#password-lock-screen { display: none !important; }</style>');
              return;
          }
          window.addEventListener('DOMContentLoaded', () => {
              const lockScreen = document.getElementById('password-lock-screen');
              const passwordInput = document.getElementById('lock-password-input');
              const submitBtn = document.getElementById('lock-submit-btn');
              const errorMsg = document.getElementById('lock-error-msg');
              
              function verify() {
                  if (passwordInput.value.trim() === correctHash) {
                      sessionStorage.setItem('read_courseware_authorized', 'true');
                      lockScreen.style.opacity = '0';
                      setTimeout(() => { lockScreen.style.display = 'none'; }, 300);
                  } else {
                      errorMsg.style.display = 'block';
                      passwordInput.value = '';
                      passwordInput.focus();
                  }
              }
              submitBtn.addEventListener('click', verify);
              passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') verify(); });
              passwordInput.focus();
          });
      })();
  </script>

請根據 IAF（International Association of Facilitators）的官方網站核心定義與標準，為我整理並撰寫一份詳細的引導指南。

【重要格式要求】
請將「整份產出內容」包裝成一個完整、排版精美、方便閱讀的 HTML 格式內容（請直接提供 <div> 或完整的 HTML 區塊，不要使用普通 Markdown 文字，以便學員直接嵌入網頁中閱讀）。請在 HTML 中使用 inline CSS 樣式進行設計，使用國泰綠 #009E52 與金黃色 #FFD100 作為主要裝飾色，呈現高質感的企業培訓閱讀視覺。

這份指南必須包含以下五個核心架構：
1. 什麼是引導（What is Facilitation?）：
   - 請用 HTML 的標題、段落與強調樣式，撰寫 IAF 官方對引導的定義及核心本質（關注流程而非內容）。
2. 主要應用場景（Key Application Scenarios）：

        // ==================== 資料持久化與同步 ====================
        function loadNotesFromLocalStorage() {
            const saved = localStorage.getItem('cathay_facilitation_notes');
            if (saved) {
                try {
                    state.notes = JSON.parse(saved);
                } catch (e) {
                    console.error('解析 localStorage 筆記資料失敗:', e);
                    state.notes = {};
                }
            }
        }

        function saveNotesToLocalStorage() {
            localStorage.setItem('cathay_facilitation_notes', JSON.stringify(state.notes));
            updateProgress();
        }

        // 防抖動機制 (Debounce)
        let saveTimeout = null;
        function triggerAutoSave(slideId, content) {
            // 顯示「儲存中...」
            elements.saveStatus.className = 'save-indicator visible saving';
            elements.saveStatusText.textContent = '儲存中...';
            
            if (saveTimeout) clearTimeout(saveTimeout);
            
            saveTimeout = setTimeout(() => {
                state.notes[slideId] = content;
                if (!content.trim()) {
                    delete state.notes[slideId];
                }
                saveNotesToLocalStorage();
                
                // 標記側邊欄的該項
                const sidebarItem = document.querySelector(`.slide-item[data-id="${slideId}"]`);
                if (sidebarItem) {
                    if (content.trim()) {
                        sidebarItem.classList.add('has-note');
                    } else {
                        sidebarItem.classList.remove('has-note');
                    }
                }
                
                // 顯示「已自動存檔」
                elements.saveStatus.className = 'save-indicator visible';
                elements.saveStatusText.textContent = '已自動存檔';
                
                // 3秒後漸隱
                setTimeout(() => {
                    if (!elements.saveStatus.classList.contains('saving')) {
                        elements.saveStatus.classList.remove('visible');
                    }
                }, 2000);
            }, 600);
        }

        // ==================== 進度指示更新 ====================
        function updateProgress() {
            const total = slidesData.length;
            const notatedCount = Object.keys(state.notes).filter(key => state.notes[key].trim()).length;
            const percent = Math.round((notatedCount / total) * 100);
            
            elements.progressPercent.textContent = `${percent}% (${notatedCount}/${total} 頁)`;
            elements.progressFill.style.width = `${percent}%`;
        }

        // ==================== UI 渲染邏輯 ====================

        // 渲染左側大綱選單 (風琴摺層次結構)
        function renderSidebarList() {
            elements.slidesList.innerHTML = '';
            
            groupsConfig.forEach(group => {
                const groupEl = document.createElement('div');
                groupEl.className = 'category-group collapsed'; // 預設收合
                groupEl.id = `group-${group.id}`;
                
                // 單元標題行
                const headerEl = document.createElement('div');
                headerEl.className = 'category-header';
                headerEl.innerHTML = `
                    <span class="category-title">${group.title}</span>
                    <svg class="category-arrow" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                    </svg>
                `;
                
                // 點擊單元標題展開/收合
                headerEl.addEventListener('click', () => {
                    groupEl.classList.toggle('collapsed');
                });
                
                // 子項目容器
                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'category-items';
                
                // 篩選該單元底下的投影片
                const groupSlides = slidesData.filter(s => s.id >= group.range[0] && s.id <= group.range[1]);
                
                groupSlides.forEach(slide => {
                    const idx = slidesData.findIndex(s => s.id === slide.id);
                    const hasNote = state.notes[slide.id] && state.notes[slide.id].trim();
                    const item = document.createElement('div');
                    item.className = `slide-item ${idx === state.currentIndex ? 'active' : ''} ${hasNote ? 'has-note' : ''}`;
                    item.setAttribute('data-id', slide.id);
                    item.setAttribute('data-index', idx);
                    
                    item.innerHTML = `
                        <div class="slide-info">
                            <div class="slide-title">${slide.displayTitle}</div>
                        </div>
                        <span class="note-status-dot"></span>
                    `;
                    
                    item.addEventListener('click', (e) => {
                        e.stopPropagation(); // 阻止氣泡事件觸發外層風琴摺的 toggle
                        state.currentIndex = idx;
                        
                        if (state.currentMode === 'list') {
                            // 全覽模式下：平滑滾動到對應的卡片
                            const cardEl = document.getElementById(`list-card-${slide.id}`);
                            if (cardEl) {
                                cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                            // 更新側邊欄高亮狀態
                            document.querySelectorAll('.slide-item').forEach((sItem) => {
                                const sIdx = parseInt(sItem.getAttribute('data-index'), 10);
                                if (sIdx === idx) {
                                    sItem.classList.add('active');
                                } else {
                                    sItem.classList.remove('active');
                                }
                            });
                            expandActiveGroup();
                        } else {
                            // 單頁專注模式下：切換顯示
                            showSlide(idx);
                        }
                        
                        if (window.innerWidth <= 768) {
                            closeSidebar();
                        }
                    });
                    
                    itemsContainer.appendChild(item);
                });
                
                groupEl.appendChild(headerEl);
                groupEl.appendChild(itemsContainer);
                elements.slidesList.appendChild(groupEl);
            });
        }

        // 自動展開包含當前作用中投影片的單元風琴摺
        function expandActiveGroup() {
            const activeSlide = slidesData[state.currentIndex];
            groupsConfig.forEach(group => {
                const groupEl = document.getElementById(`group-${group.id}`);
                if (groupEl) {
                    const headerEl = groupEl.querySelector('.category-header');
                    const isActiveGroup = activeSlide.id >= group.range[0] && activeSlide.id <= group.range[1];
                    
                    if (isActiveGroup) {
                        groupEl.classList.remove('collapsed');
                        if (headerEl) headerEl.classList.add('active');
                    } else {
                        if (headerEl) headerEl.classList.remove('active');
                    }
                }
            });
        }

                        <div class="ai-prompt-body" id="focus-ai-prompt">${iafPromptText}</div>
                    </div>
                `;
                elements.focusNoteInput.placeholder = "請在此貼上 AI 的產出 HTML 內容，或輸入您的心得與筆記...";
            } else {
                promptContainer.innerHTML = '';
                elements.focusNoteInput.placeholder = "請在此輸入您的心得、反思、討論重點或練習答案...系統將即時自動存檔。";
            }
            
            // 自動展開對應的單元
            expandActiveGroup();
            
            // 標記側邊欄目前選取項
            document.querySelectorAll('.slide-item').forEach((item) => {
                const itemIdx = parseInt(item.getAttribute('data-index'), 10);
                if (itemIdx === index) {
                    item.classList.add('active');
                    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    item.classList.remove('active');
                }
            });
            
            // 控制前/後頁按鈕狀態
            elements.prevSlideBtn.disabled = index === 0;
            elements.nextSlideBtn.disabled = index === slidesData.length - 1;
        }

        // 預先載入前後幾張圖片，以獲得流暢的切換效果
        function preloadImages() {
            slidesData.forEach((slide) => {
                const img = new Image();
                img.src = `./2026 READ/${slide.file}`;
            });
        }

        // ==================== 搜尋過濾功能 ====================
        function handleSearch(query) {
            state.searchQuery = query.toLowerCase().trim();
            
            if (state.currentMode === 'focus') {
                groupsConfig.forEach(group => {
                    const groupEl = document.getElementById(`group-${group.id}`);
                    if (!groupEl) return;
                    
                    let hasVisibleItem = false;
                    const itemsInGroup = groupEl.querySelectorAll('.slide-item');
                    
                    itemsInGroup.forEach(item => {
                        const idx = parseInt(item.getAttribute('data-index'), 10);
                        const slide = slidesData[idx];
                        const noteText = (state.notes[slide.id] || '').toLowerCase();
                        const matchTitle = slide.title.toLowerCase().includes(state.searchQuery) || slide.displayTitle.toLowerCase().includes(state.searchQuery);
                        const matchNote = noteText.includes(state.searchQuery);
                        const matchIndex = slide.id.toString() === state.searchQuery;
                        
                        if (matchTitle || matchNote || matchIndex || !state.searchQuery) {
                            item.style.display = 'flex';
                            hasVisibleItem = true;
                        } else {
                            item.style.display = 'none';
                        }
                    });
                    
                    if (hasVisibleItem) {
                        groupEl.style.display = 'block';
                        // 搜尋時自動展開匹配的組別
                        if (state.searchQuery) {
                            groupEl.classList.remove('collapsed');
                        } else {
                            // 清除搜尋時，恢復作用中單元的展開狀態，其餘收合
                            const activeSlide = slidesData[state.currentIndex];
                            const isActiveGroup = activeSlide.id >= group.range[0] && activeSlide.id <= group.range[1];
                            if (isActiveGroup) {
                                groupEl.classList.remove('collapsed');
                            } else {
                                groupEl.classList.add('collapsed');
                            }
                        }
                    } else {
                        groupEl.style.display = 'none';
                    }
                });
            } else {
                renderListView();
            }
        }

        // 渲染全覽列表模式
        function renderListView() {
            elements.listViewContainer.innerHTML = '';
            let matchCount = 0;
            
            slidesData.forEach((slide, idx) => {
                const noteText = state.notes[slide.id] || '';
                const matchTitle = slide.title.toLowerCase().includes(state.searchQuery) || slide.displayTitle.toLowerCase().includes(state.searchQuery);
                const matchNote = noteText.toLowerCase().includes(state.searchQuery);
                const matchIndex = slide.id.toString() === state.searchQuery;
                
                if (state.searchQuery && !matchTitle && !matchNote && !matchIndex) {
                    return;
                }
                
                matchCount++;
                const imgPath = `./2026 READ/${slide.file}`;
                const card = document.createElement('div');
                card.className = 'list-card';
                card.id = `list-card-${slide.id}`;
                card.innerHTML = `
                    <div class="list-card-image-box">
                        <img src="${imgPath}" alt="${slide.title}" class="list-card-img" loading="lazy">
                    </div>
                    <div class="list-card-content-box">
                        <div class="panel-slide-meta">
                            <span class="panel-slide-index">Page ${slide.id.toString().padStart(2, '0')}</span>
                            <span class="badge-category badge-${slide.category.toLowerCase()}">${slide.category}</span>
                        </div>
                        <h3 class="panel-slide-title">${slide.title}</h3>
                        
                        ${slide.id === 1 ? `
                        <div class="ai-prompt-card" style="margin-top: 12px; margin-bottom: 12px;">
                            <div class="ai-prompt-header">
                                <span class="ai-prompt-title">🤖 課前探索：AI 引導術 Prompt</span>
                                <button class="btn-copy-prompt" onclick="copyPromptText('list-ai-prompt')">複製 Prompt</button>
                            </div>
                            <div class="ai-prompt-body" id="list-ai-prompt">${iafPromptText}</div>
                        </div>
                        ` : ''}
                        
                        <div class="note-area-group">
                            <div class="note-header">
                                <label class="note-label">隨堂筆記</label>
                            </div>
                            <textarea class="note-textarea list-note-textarea" data-id="${slide.id}" placeholder="${slide.id === 1 ? '請在此貼上 AI 的產出 HTML 內容，或輸入您的心得與筆記...' : '請在此輸入您的心得、筆記或練習答案...'}">${noteText}</textarea>
                        </div>
                    </div>
                `;
                
                const textarea = card.querySelector('.list-note-textarea');
                textarea.addEventListener('input', (e) => {
                    const content = e.target.value;
                    state.notes[slide.id] = content;
                    if (!content.trim()) delete state.notes[slide.id];
                    saveNotesToLocalStorage();
                    
                    const sidebarItem = document.querySelector(`.slide-item[data-id="${slide.id}"]`);
                    if (sidebarItem) {
                        if (content.trim()) sidebarItem.classList.add('has-note');
                        else sidebarItem.classList.remove('has-note');
                    }
                });
                
                elements.listViewContainer.appendChild(card);
            });
            
            if (matchCount === 0) {
                elements.listViewContainer.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">
                        <svg width="48" height="48" fill="currentColor" viewBox="0 0 16 16" style="margin-bottom: 16px; opacity: 0.5;">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                        </svg>
                        <p>找不到符合關鍵字「<strong>${state.searchQuery}</strong>」的投影片或筆記內容。</p>
                    </div>
                `;
            }
        }

        // ==================== 側邊欄收合與滑出控制 ====================
        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                state.sidebarOpen = !state.sidebarOpen;
                if (state.sidebarOpen) {
                    elements.sidebar.classList.add('active');
                    elements.sidebarOverlay.classList.add('active');
                } else {
                    closeSidebar();
                }
            } else {
                const appContainer = document.querySelector('.app-container');
                if (appContainer) {
                    appContainer.classList.toggle('sidebar-collapsed');
                    const isCollapsed = appContainer.classList.contains('sidebar-collapsed');
                    localStorage.setItem('sidebar_collapsed_pref', isCollapsed ? 'true' : 'false');
                }
            }
        }

        function closeSidebar() {
            state.sidebarOpen = false;
            elements.sidebar.classList.remove('active');
            elements.sidebarOverlay.classList.remove('active');
        }

        // ==================== PDF 列印排版與筆記匯出 ====================

        function preparePrintContainer() {
            elements.printContainer.innerHTML = '';
            
            slidesData.forEach(slide => {
                const noteText = state.notes[slide.id] || '';
                const imgPath = `./2026 READ/${slide.file}`;
                
                const pageEl = document.createElement('div');
                pageEl.className = 'print-page';
                
                pageEl.innerHTML = `
                    <div class="print-image-col">
                        <img src="${imgPath}" alt="${slide.title}" class="print-slide-img">
                    </div>
                    <div class="print-note-col">
                        <div class="print-slide-index">Page ${slide.id.toString().padStart(2, '0')}</div>
                        <div class="print-slide-title">${slide.title}</div>
                        <div class="print-note-label">📝 課堂筆記與練習記錄：</div>
                        <div class="print-note-content ${noteText.trim() ? '' : 'empty'}">${noteText.trim() ? noteText : '請在此處記錄手寫筆記...'}</div>
                    </div>
                `;
                
                elements.printContainer.appendChild(pageEl);
            });
        }

        function exportNotesToTxt() {
            const notatedIds = Object.keys(state.notes).filter(id => state.notes[id].trim());
            
            if (notatedIds.length === 0) {
                alert('您目前尚未填寫任何講義筆記！');
                return;
            }
            
            let text = `==================================================\n`;
            text += `     國泰人壽《溝通引導術》互動講義 - 個人學習筆記\n`;
            text += `     時間：${new Date().toLocaleString()}\n`;
            text += `==================================================\n\n`;
            
            notatedIds.sort((a, b) => Number(a) - Number(b)).forEach(id => {
                const slide = slidesData.find(s => s.id === Number(id));
                text += `【Page ${id.toString().padStart(2, '0')}】${slide.title}\n`;
                text += `單元類別: ${slide.category}\n`;
                text += `筆記內容:\n${state.notes[id]}\n`;
                text += `--------------------------------------------------\n\n`;
            });
            
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `國泰人壽_溝通引導術_個人學習筆記.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ==================== 事件監聽設定 ====================
        function setupEventListeners() {
            
            // 模式切換按鈕事件
            elements.modeFocusBtn.addEventListener('click', () => {
                state.currentMode = 'focus';
                elements.modeFocusBtn.classList.add('active');
                elements.modeListBtn.classList.remove('active');
                elements.focusViewContainer.style.display = 'grid';
                elements.listViewContainer.style.display = 'none';
                showSlide(state.currentIndex);
            });

            elements.modeListBtn.addEventListener('click', () => {
                state.currentMode = 'list';
                elements.modeListBtn.classList.add('active');
                elements.modeFocusBtn.classList.remove('active');
                elements.focusViewContainer.style.display = 'none';
                elements.listViewContainer.style.display = 'flex';
                renderListView();
                
                // 自動滾動定位到當前正在閱讀的投影片
                setTimeout(() => {
                    const activeSlide = slidesData[state.currentIndex];
                    const cardEl = document.getElementById(`list-card-${activeSlide.id}`);
                    if (cardEl) {
                        cardEl.scrollIntoView({ block: 'center' });
                    }
                }, 50);
            });

            // 專注模式 - 前/後按鈕
            elements.prevSlideBtn.addEventListener('click', () => {
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    showSlide(state.currentIndex);
                }
            });

            elements.nextSlideBtn.addEventListener('click', () => {
                if (state.currentIndex < slidesData.length - 1) {
                    state.currentIndex++;
                    showSlide(state.currentIndex);
                }
            });

            // 鍵盤左右鍵快捷切換
            document.addEventListener('keydown', (e) => {
                if (state.currentMode === 'focus' && document.activeElement !== elements.focusNoteInput && document.activeElement !== elements.searchBox) {
                    if (e.key === 'ArrowLeft' && state.currentIndex > 0) {
                        state.currentIndex--;
                        showSlide(state.currentIndex);
                    } else if (e.key === 'ArrowRight' && state.currentIndex < slidesData.length - 1) {
                        state.currentIndex++;
                        showSlide(state.currentIndex);
                    }
                }
            });

            // 筆記輸入事件 (Focus Mode)
            elements.focusNoteInput.addEventListener('input', (e) => {
                const slide = slidesData[state.currentIndex];
                triggerAutoSave(slide.id, e.target.value);
            });

            // 搜尋框輸入事件
            elements.searchBox.addEventListener('input', (e) => {
                handleSearch(e.target.value);
            });

            // 燈箱控制事件
            elements.lightboxTrigger.addEventListener('click', () => {
                const slide = slidesData[state.currentIndex];
                elements.lightboxImg.src = `./2026 READ/${slide.file}`;
                elements.lightbox.classList.add('active');
            });
            
            elements.lightboxCloseBtn.addEventListener('click', () => {
                elements.lightbox.classList.remove('active');
            });
            
            elements.lightbox.addEventListener('click', (e) => {
                if (e.target === elements.lightbox) {
                    elements.lightbox.classList.remove('active');
                }
            });

            // 側邊欄收合與切換事件
            elements.sidebarToggleBtn.addEventListener('click', toggleSidebar);
            elements.sidebarOverlay.addEventListener('click', () => {
                state.sidebarOpen = false;
                elements.sidebar.classList.remove('active');
                elements.sidebarOverlay.classList.remove('active');
            });

            // 功能按鈕：匯出與列印
            elements.exportTxtBtn.addEventListener('click', exportNotesToTxt);
            
            elements.printPdfBtn.addEventListener('click', () => {
                preparePrintContainer();
                setTimeout(() => {
                    window.print();
                }, 300);
            });
        }

        // 啟動應用
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
